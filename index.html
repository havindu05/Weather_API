<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>

<body>

    <div class="main">

        <div class="input-items">
            <input class="city" placeholder="Search City" type="text">
            <button class="searchbtn">
                <span class="material-symbols-outlined">
                    search
                </span>
            </button>
        </div>


        <section class="weatherInfo">
            <div class="wrapper">
                <span class="material-symbols-outlined loactionIcon">location_on</span>
                <span class="loacation">Sri Lanka </span>
                <span class="loacationCity">Ambalangoda</span>
                <div class="date">Sat, 08 Aug</div>
                <div class="Time" id="localTime">12:00 PM</div>
              </div>
            <div class="weatherIcon">
                <img src="assest/images/Weather-removebg-preview.png" alt="Weather Icon">
            </div>
        
            <div class="temp">29°C</div>
            <div class="tempText">Cloudy</div>
        
            <div class="humidityWindContainer">
                <div class="humidity">
                    <span class="material-symbols-outlined humiIcon">water_drop</span>
                    <span class="humiText1">Humidity</span>
                    <span class="humiText2">75%</span>
                </div>
                <div class="wind">
                    <span class="material-symbols-outlined windIcon">air</span>
                    <span class="windText1">Wind Speed</span>
                    <span class="windText2">1.54 M/s</span>
                </div>
            </div>
            
           <div class="infoContainer"> 
                <div class="infoItem" id="cloudCover">
                  <span class="infoLabel">Cloud Cover</span>
                  <span class="infoValue">75%</span>
                </div>
              
                <div class="infoItem" id="uvIndex">
                  <span class="infoLabel">UV Index</span>
                  <span class="infoValue">5</span>
                </div>
              
                <div class="infoItem" id="pressure">
                  <span class="infoLabel">Pressure</span>
                  <span class="infoValue">1013 hPa</span>
                </div>
              
                <div class="infoItem" id="visibility">
                  <span class="infoLabel">Visibility</span>
                  <span class="infoValue">10 km</span>
                </div>
              </div> 
               
            
        </section>
        

            <div class="forecastItemsPack">

                <div class="forecastItem">
                    <h5 class="forcastDate">09 Aug</h5>
                    <img src="assest/images/Unknown-23_copy-removebg-preview.png" alt="pic">
                    <h5 class="forcastTemp"> 18 °C</h5>
                </div>
                <div class="forecastItem">
                    <h5 class="forcastDate">10 Aug</h5>
                    <img src="assest/images/Unknown-23_copy-removebg-preview.png" alt="pic">
                    <h5 class="forcastTemp"> 18 °C</h5>
                </div>
                <div class="forecastItem">
                    <h5 class="forcastDate">11 Aug</h5>
                    <img src="assest/images/Unknown-23_copy-removebg-preview.png" alt="pic">
                    <h5 class="forcastTemp"> 20 °C</h5>
                </div>
                <div class="forecastItem">
                    <h5 class="forcastDate">12 Aug</h5>
                    <img src="assest/images/Unknown-23_copy-removebg-preview.png" alt="pic">
                    <h5 class="forcastTemp"> 17 °C</h5>
                </div>
                <div class="forecastItem">
                    <h5 class="forcastDate">13 Aug</h5>
                    <img src="assest/images/Unknown-23_copy-removebg-preview.png" alt="pic">
                    <h5 class="forcastTemp"> 19 °C</h5>
                </div>
                <div class="forecastItem">
                    <h5 class="forcastDate">14 Aug</h5>
                    <img src="assest/images/Unknown-23_copy-removebg-preview.png" alt="pic">
                    <h5 class="forcastTemp"> 18 °C</h5>
                </div>
                <div class="forecastItem">
                    <h5 class="forcastDate">15 Aug</h5>
                    <img src="assest/images/Unknown-23_copy-removebg-preview.png" alt="pic">
                    <h5 class="forcastTemp"> 20 °C</h5>
                </div>
            </div>
        </section>
    </div>
    <script src="home.js"></script>
</body>

</html>
