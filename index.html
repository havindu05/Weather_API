<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>

<body>

    <div class="main">

        <div class="input-items">
            <input class="city" placeholder="Search City" type="text">
            <button class="searchbtn">
                <span class="material-symbols-outlined">
                    search
                </span>
            </button>
        </div>


        <section class="weatherInfo">
            <div class="loactionIcon">
                <span class="material-symbols-outlined">
                    location_on
                </span>
            </div>
            <div class="loacation">
                Sri Lanka
            </div>
            <div class="date">
                Sat, 08 Aug
            </div>
            <div class="weatherIcon">
                <img src="assest/images/Weather-removebg-preview.png" alt="pic">
            </div>
            <div class="temp">
                29°C
            </div>
            <div class="tempText">
                Cloudy
            </div>
            <div class="humiIcon">
                <span class="material-symbols-outlined">
                    water_drop
                </span>
            </div>
            <div class="humiText1">
                Humidty
            </div>
            <div class="humiText2">
                75%
            </div>
            <div class="windIcon">
                <span class="material-symbols-outlined">
                    air
                </span>
            </div>
            <div class="windText1">
                Wind Speed
            </div>
            <div class="windText2">
                1.54 M/s
            </div>


            <div class="forecastItemsPack">

                <div class="forecastItem">
                    <h5 class="forcastDate">09 Aug</h5>
                    <img src="assest/images/Unknown-23_copy-removebg-preview.png" alt="pic">
                    <h5 class="forcastTemp"> 18 °C</h5>
                </div>
                <div class="forecastItem">
                    <h5 class="forcastDate">10 Aug</h5>
                    <img src="assest/images/Unknown-23_copy-removebg-preview.png" alt="pic">
                    <h5 class="forcastTemp"> 18 °C</h5>
                </div>
                <div class="forecastItem">
                    <h5 class="forcastDate">11 Aug</h5>
                    <img src="assest/images/Unknown-23_copy-removebg-preview.png" alt="pic">
                    <h5 class="forcastTemp"> 20 °C</h5>
                </div>
                <div class="forecastItem">
                    <h5 class="forcastDate">12 Aug</h5>
                    <img src="assest/images/Unknown-23_copy-removebg-preview.png" alt="pic">
                    <h5 class="forcastTemp"> 17 °C</h5>
                </div>
                <div class="forecastItem">
                    <h5 class="forcastDate">13 Aug</h5>
                    <img src="assest/images/Unknown-23_copy-removebg-preview.png" alt="pic">
                    <h5 class="forcastTemp"> 19 °C</h5>
                </div>
                <div class="forecastItem">
                    <h5 class="forcastDate">14 Aug</h5>
                    <img src="assest/images/Unknown-23_copy-removebg-preview.png" alt="pic">
                    <h5 class="forcastTemp"> 18 °C</h5>
                </div>
                <div class="forecastItem">
                    <h5 class="forcastDate">15 Aug</h5>
                    <img src="assest/images/Unknown-23_copy-removebg-preview.png" alt="pic">
                    <h5 class="forcastTemp"> 20 °C</h5>
                </div>
            </div>
        </section>
    </div>
</body>

</html>
