<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>

<body>

    <div class="main">

        <div class="input-items">
            <input class="city" placeholder="Search City" type="text">
            <button class="searchbtn">
                <span class="material-symbols-outlined">
                    search
                </span>
            </button>
        </div>


        <section class="weatherInfo">
            <div class="loactionIcon">
                <span class="material-symbols-outlined">
                    location_on
                </span>
            </div>
            <div class="loacation">
                Sri Lanka
            </div>
            <div class="date">
                Sat, 08 Aug
            </div>
            <div class="weatherIcon">
                <img src="assest/images/Weather-removebg-preview.png" alt="pic">
            </div>
            <div class="temp">
                29°C
            </div>
            <div class="tempText">
                Cloudy
            </div>
            <div class="humiIcon">
                <span class="material-symbols-outlined">
                    water_drop
                </span>
            </div>
            <div class="humiText1">
                Humidty
            </div>
            <div class="humiText2">
                75%
            </div>
        </section>


    </div>





</body>

</html>
